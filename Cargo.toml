[package]
name = "monita"
version = "1.1.0"
edition = "2024"
rust-version = "1.97"
description = "Self-hosted uptime, incident and status service"
license = "MIT"
publish = false

[features]
default = ["embed"]
# Debug builds embed web/dist and static/ too, so a debug binary stands alone (e2e, CI).
# `make dev` turns it off: the server then reads both folders from disk on each request.
embed = ["rust-embed/debug-embed"]

[dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
getrandom = "0.4"
# SVG only: the default features pull in `image`. The two-factor setup QR (v1.1).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = "1.0"
sha2 = "0.11"
# Already in the tree through tokio and hyper: the ICMP datagram socket of a ping check (v1.1 Q24).
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# SQLite itself, compiled in (`bundled`), so the binary needs no system library.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
# Compresses JSON answers (platform::compress).
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
http-body = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27"

# Local builds on an 8 GiB laptop: line tables for backtraces, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Size over speed: fat LTO and opt-level "s" cut the binary by a quarter (25.8 to 19.4 MB on
# macOS arm64). The checks wait on the network, not the CPU. The cost measured was an Argon2
# sign-in hash at 20 ms instead of 16 ms. Measure again before changing either value.
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
