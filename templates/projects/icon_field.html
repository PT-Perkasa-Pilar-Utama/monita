{# The icon picker. The file input has no name: app.js scales the picture to a 128 px square
   and puts it, as base64, in the hidden `icon` field. Without the script no icon is sent. #}
<div class="field">
  <label class="label" for="icon-file">Icon (optional, a square picture fits best)</label>
  <div class="iconpick">
    <img class="switcher__badge iconpick__preview" data-icon-preview alt="" hidden>
    <input class="input iconpick__file" id="icon-file" type="file" accept="image/png,image/jpeg,image/webp" data-icon-file>
  </div>
  <input type="hidden" name="icon" data-icon-value>
</div>
