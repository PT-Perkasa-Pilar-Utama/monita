{% extends "layout/base.html" %}
{% block body %}
<main class="bare">
  <button class="btn btn--ghost btn--icon bare__theme" type="button" data-theme-toggle aria-label="Switch light or dark theme" title="Switch theme"><svg class="icon" aria-hidden="true"><use href="{{ crate::platform::assets::url("icons.svg") }}#i-theme"/></svg></button>
  <a class="bare__brand" href="/">{% include "ui/mark.html" %}<span>Monita</span></a>
  <p class="bare__tag">Uptime, incidents and status pages for your team.</p>
  {% block content %}{% endblock %}
  <footer class="bare__foot"><span>MIT licensed. Made by PT. Perkasa Pilar Utama.</span><a href="https://github.com/PT-Perkasa-Pilar-Utama/monita">GitHub</a><a href="https://pt-perkasa-pilar-utama.github.io/monita/docs/">Documentation</a></footer>
</main>
{% endblock %}
