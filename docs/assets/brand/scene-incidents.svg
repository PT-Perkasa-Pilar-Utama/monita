<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="Moni follows an incident from open to resolved and sends the alert"><style>@keyframes monita-ping{to{stroke-dashoffset:-22}}
