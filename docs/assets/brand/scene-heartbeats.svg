<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="Moni hears a scheduled job ping on time"><style>@keyframes monita-ping{to{stroke-dashoffset:-22}}
@keyframes monita-blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes monita-beat{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes monita-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes monita-toss{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes monita-rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes monita-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><marker id="heartbeats-arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--art-primary,#c4258f)"></path></marker><marker id="heartbeats-arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--art-up,#23784e)"></path></marker></defs><line x1="0" y1="180.75" x2="560" y2="180.75" stroke-width="1.5" style="stroke:var(--art-input,#c9cbce)"/><g><rect x="24" y="64" width="232" height="116" rx="12" stroke-width="1.5" style="fill:var(--art-card,#ffffff);stroke:var(--art-input,#c9cbce)"></rect><line x1="24" y1="88" x2="256" y2="88" stroke-width="1.5" style="stroke:var(--art-input,#c9cbce)"></line><circle cx="40" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"></circle><circle cx="52" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"></circle><circle cx="64" cy="76" r="3.5" style="fill:var(--art-input,#c9cbce)"></circle><rect x="80" y="72" width="100" height="8" rx="4" style="fill:var(--art-input,#c9cbce)"></rect><text x="40" y="114" style="fill:var(--art-muted-foreground,#7a7f87);font-family:'Geist Mono',ui-monospace,monospace;font-size:11px">$ ./nightly-backup.sh</text><rect x="40" y="126" width="150" height="8" rx="4" style="fill:var(--art-input,#c9cbce)"></rect><rect x="40" y="142" width="64" height="22" rx="6" style="fill:var(--art-up,#23784e);fill-opacity:0.15"></rect><text x="72" y="157" text-anchor="middle" style="fill:var(--art-up,#23784e);font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:600">exit 0</text></g><g style="stroke:var(--art-muted-foreground,#7a7f87)" stroke-width="2.5" stroke-linecap="round"><circle cx="244" cy="64" r="15" style="fill:var(--art-card,#ffffff)"></circle><line x1="244" y1="64" x2="244" y2="55"></line><line x1="244" y1="64" x2="251" y2="68"></line></g><path d="M262 132 C 296 94, 326 92, 350 106" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 7" marker-end="url(#heartbeats-arrow-up)" style="animation:monita-ping 1.1s linear infinite;stroke:var(--art-up,#23784e);stroke-opacity:0.7"></path><path transform="translate(304 92) scale(0.7)" d="M0 8C-12 0-9-10 0-4C9-10 12 0 0 8Z" style="fill:var(--art-up,#23784e);fill-opacity:0.7"></path><path transform="translate(366 112) scale(1.4)" d="M0 8C-12 0-9-10 0-4C9-10 12 0 0 8Z" style="animation:monita-beat 1.2s ease-in-out infinite;fill:var(--art-up,#23784e)"></path><g transform="translate(440 124) scale(1 1)"><ellipse cx="-16" cy="50" rx="12" ry="6" style="fill:#c4258f"></ellipse><ellipse cx="16" cy="50" rx="12" ry="6" style="fill:#c4258f"></ellipse><line x1="0" y1="-46" x2="0" y2="-60" stroke-width="3" stroke-linecap="round" style="stroke:#c4258f"></line><circle cx="0" cy="-64" r="5" style="animation:monita-beat 2s ease-in-out infinite;fill:#c4258f"></circle><circle r="46" stroke-width="4" style="fill:#fbe4f2;stroke:#c4258f"></circle><g style="transform-origin:center;animation:monita-blink 5s ease-in-out infinite;transform-box:fill-box"><ellipse cx="-22" cy="-14" rx="5" ry="6.5" style="fill:#1e1a1d"></ellipse><ellipse cx="6" cy="-14" rx="5" ry="6.5" style="fill:#1e1a1d"></ellipse></g><circle cx="-20.5" cy="-16.5" r="1.6" style="fill:#ffffff"></circle><circle cx="7.5" cy="-16.5" r="1.6" style="fill:#ffffff"></circle><ellipse cx="-32" cy="2" rx="6" ry="3.5" style="fill:#f2a7d4"></ellipse><ellipse cx="18" cy="2" rx="6" ry="3.5" style="fill:#f2a7d4"></ellipse><path d="M-20 10h5l3-7 6 12 3-5h5" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:#c4258f"></path></g><path d="M396 136 Q 38