name: release

# A `v*` tag push builds the static binary, boots it, and opens a draft release with the archive,
# its checksum and a build-provenance attestation. Write the notes with the release-notes skill,
# then publish the draft. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      # No build cache: a tag build must not restore anything a branch run wrote.
      - run: make release
        env:
          CARGO_BUILD_JOBS: 4
      - name: boot the binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/monita
          MONITA_ENV=test MONITA_BIND=127.0.0.1:18080 MONITA_DB_PATH="$RUNNER_TEMP/smoke.db" "$bin" serve &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18080/healthz; then kill "$pid"; exit 0; fi
            sleep 1
          done
          kill "$pid" || true
          echo "::error::the release binary did not answer /healthz"
          exit 1
      - name: package
        run: |
          mkdir dist
          # No version in the name, so releases/latest/download/monita_linux_amd64.tar.gz always works.
          # The fonts are embedded in the binary; their licences ship beside it.
          tar -czf dist/monita_linux_amd64.tar.gz -C target/x86_64-unknown-linux-musl/release monita \
            -C "$GITHUB_WORKSPACE" LICENSE licenses deploy/monita.service deploy/monita.env.example
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --title "$TAG" --notes "Draft. Write the notes with the release-notes skill, then publish." dist/*
