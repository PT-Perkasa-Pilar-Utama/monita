name: release

# A `v*` tag push builds Linux, macOS and Windows binaries for amd64 and arm64, boots each, and
# opens a draft release with the archives, their checksums and a build-provenance attestation.
# Write the notes with the release-notes skill, then publish the draft. The tag must match the
# version in Cargo.toml.
#
# Run it by hand with an existing tag to finish or extend its release. It builds the tag's
# source; with no release yet it drafts one, otherwise it keeps every archive already published
# byte for byte and appends the new checksums. Run it by hand with `build_only` on a branch to build and boot every target from
# that branch without touching any release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, such as v1.0.0. Leave empty with build_only."
        required: false
      build_only:
        description: "Build and boot every target from the chosen branch; release nothing"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      # A trial build reports every target; a release stops at the first failure.
      fail-fast: ${{ !inputs.build_only }}
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: tar.gz }
          - { os: darwin, arch: arm64, runner: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          # Cross-built on Apple silicon; it boots under Rosetta when the runner has it.
          - { os: darwin, arch: amd64, runner: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows, arch: amd64, runner: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: windows, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_ONLY: ${{ inputs.build_only && 'yes' || 'no' }}
      TARGET: ${{ matrix.target }}
      ARCHIVE: monita_${{ matrix.os }}_${{ matrix.arch }}.${{ matrix.ext }}
      BIN: monita${{ matrix.os == 'windows' && '.exe' || '' }}
      # aws-lc-sys ships assembled x86 objects, so the Windows runner needs no NASM.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - name: tag is a version
        if: env.BUILD_ONLY == 'no'
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$TAG is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_only && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false
      - name: tag matches Cargo.toml
        if: env.BUILD_ONLY == 'no'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # aws-lc-sys compiles C. On arm64 the cc crate would look for aarch64-linux-musl-gcc, which
      # musl-tools does not ship, so both Linux targets name musl-gcc.
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(echo "$TARGET" | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: rustup target add "$TARGET"
      # The same steps as `make web`; not every runner has make. No build cache: a tag build must
      # not restore anything a branch run wrote.
      - name: build the web pages
        run: cd web && bun install --frozen-lockfile && bun run build
      - run: cargo build --release --locked --target "$TARGET"
        env:
          CARGO_BUILD_JOBS: 4
      - name: boot the binary
        run: |
          bin="target/$TARGET/release/$BIN"
          if [ "$TARGET" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::no Rosetta on this runner; the Intel macOS binary was built but not booted"
            exit 0
          fi
          MONITA_ENV=test MONITA_BIND=127.0.0.1:18080 MONITA_DB_PATH="$RUNNER_TEMP/smoke.db" "$bin" serve &
          pid=$!
          stop() { kill "$pid" 2>/dev/null || true; if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM "$BIN" >/dev/null 2>&1 || true; fi; }
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18080/healthz; then stop; exit 0; fi
            sleep 1
          done
          stop
          echo "::error::the $TARGET binary did not answer /healthz"
          exit 1
      - name: package
        run: |
          mkdir dist
          # No version in the name, so releases/latest/download/<archive> always works. The fonts
          # are embedded in the binary; their licences ship beside it. Only Linux gets the
          # systemd unit: `monita service` runs on Linux only.
          cp "target/$TARGET/release/$BIN" "$BIN"
          case "$RUNNER_OS" in
            Linux) tar -czf "dist/$ARCHIVE" "$BIN" LICENSE licenses deploy/monita.env.example deploy/monita.service ;;
            macOS) tar -czf "dist/$ARCHIVE" "$BIN" LICENSE licenses deploy/monita.env.example ;;
            Windows) 7z a -tzip "dist/$ARCHIVE" "$BIN" LICENSE licenses deploy/monita.env.example ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: draft the release, or add to it
    needs: build
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: monita_*
          merge-multiple: true
          path: dist
      # A first run creates the draft. A later run on the same tag, by hand or a re-run, finds
      # the release and adds only what it lacks, so a published archive never changes.
      - name: keep what the release already has
        id: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > published.txt; then
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in dist/monita_*; do
            if grep -qx "$(basename "$f")" published.txt; then
              echo "keeps the published $(basename "$f")"
              rm "$f"
            fi
          done
          if grep -qx checksums.txt published.txt; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir old
          fi
      - name: checksums
        run: |
          if ! ls dist/monita_* >/dev/null 2>&1; then
            echo "::notice::$TAG already has every archive"
            exit 0
          fi
          (cd dist && sha256sum ./monita_* > new.txt)
          # The runner's bash has pipefail on, so a missing old file must not reach `cat`.
          if [ -f old/checksums.txt ]; then
            cat old/checksums.txt dist/new.txt
          else
            cat dist/new.txt
          fi | sort -k2 -u > dist/checksums.txt
          rm dist/new.txt
          cat dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: hashFiles('dist/monita_*') != ''
        with:
          subject-path: dist/monita_*
      - name: draft the release
        if: steps.release.outputs.exists == 'no'
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes "Draft. Write the notes with the release-notes skill, then publish." dist/*
      - name: add the new archives
        if: steps.release.outputs.exists == 'yes' && hashFiles('dist/monita_*') != ''
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/monita_*
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/checksums.txt
