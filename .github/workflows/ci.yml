name: ci

# Pattern from testate's ci.yml. Work lands on main directly (trunk-based), so main pushes run the
# browser suite too; a shard that passed on the same inputs skips itself (e2e/lib/shards.ts).
# A pull request that touches only docs and Markdown runs the fast gate alone.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          code_files=$(printf '%s\n' "$changed" | grep -vE '^docs/|\.md$' || true)
          if [ -n "$code_files" ]; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::code changed: $code"

  # The one Rust build. `cargo test --tests` also builds the debug binary, which the e2e shards
  # download instead of compiling again.
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make check
        env:
          CARGO_BUILD_JOBS: 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monita-debug
          path: target/debug/monita
          retention-days: 1

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  e2e:
    name: browser end-to-end (${{ matrix.shard }})
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [smoke, flows]
    env:
      E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Bare Bun, before any install: the key script imports nothing but the shard table.
      - name: shard input key
        id: key
        run: echo "key=e2e-pass-${{ matrix.shard }}-$(bun e2e/lib/shard-key.ts "$E2E_SHARD")" >> "$GITHUB_OUTPUT"
      - name: passed before on these inputs?
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-pass
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: run this shard?
        id: run
        env:
          HIT: ${{ steps.passed.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "::notice::$E2E_SHARD passed before on these inputs; skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.run.outputs.run == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('e2e/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: steps.run.outputs.run == 'true'
        working-directory: e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.run.outputs.run == 'true'
        with:
          name: monita-debug
          path: target/debug
      # Artifacts drop the executable bit.
      - run: chmod +x target/debug/monita
        if: steps.run.outputs.run == 'true'
      # The runner's Chrome (channel: chrome), no `playwright install`. A shard with no specs yet passes.
      - run: bunx playwright test --pass-with-no-tests
        if: steps.run.outputs.run == 'true'
        working-directory: e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.run.outputs.run == 'true'
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: record the pass
        if: success() && steps.run.outputs.run == 'true'
        run: mkdir -p .e2e-pass && echo "${{ github.sha }}" > .e2e-pass/passed
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.run.outputs.run == 'true'
        with:
          path: .e2e-pass
          key: ${{ steps.key.outputs.key }}

  # `monita setup` and `monita service` as root on a real systemd host, which `cargo test` lacks.
  cli:
    name: service install smoke
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monita-debug
          path: target/debug
      - run: shellcheck -s sh scripts/*.sh
      - run: sudo sh scripts/smoke-cli.sh target/debug/monita
      - name: service log
        if: failure()
        run: sudo journalctl -u monita --no-pager -n 200

  # The project site on GitHub Pages: the landing page and docs (site/build.ts), and the demo,
  # the debug binary on seeds/demo.sql crawled to HTML (e2e/demo/snapshot.ts). Built here,
  # never committed. Main only.
  demo:
    name: publish the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monita-debug
          path: target/debug
      - run: chmod +x target/debug/monita
      # No `bun install`: neither script needs a package; only --screens loads Playwright.
      - run: bun test site
      - run: bun site/build.ts
      - run: bun e2e/demo/snapshot.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A branch rule can require this one name; the shards answer through it. A skipped e2e passes
  # only when nothing but docs changed and the check job passed; a failed check also skips e2e.
  e2e-result:
    name: browser end-to-end
    if: always()
    runs-on: ubuntu-latest
    needs: [e2e, check, changes]
    steps:
      - name: every shard passed
        env:
          E2E: ${{ needs.e2e.result }}
          CHECK: ${{ needs.check.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          test "$E2E" = "success" && exit 0
          test "$E2E" = "skipped" && test "$CHECK" = "success" && test "$CODE" = "false"
