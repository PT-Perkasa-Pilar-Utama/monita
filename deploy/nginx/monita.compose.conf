# nginx in front of Monita in Docker Compose: the same as monita.conf, but the upstream is the
# `monita` service. compose.yaml in this folder mounts it with the certificates.
# No limit_req here on purpose: see monita.conf.

server {
    listen 80;
    listen [::]:80;
    server_name monita.company.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monita.company.co.id;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 16m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://monita:7466;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
