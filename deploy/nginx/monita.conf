# nginx in front of Monita installed with `monita service install` (MONITA_BIND=127.0.0.1:7466).
# Copy it to /etc/nginx/conf.d/monita.conf, replace monita.company.co.id and the certificate
# paths, then run `nginx -t && systemctl reload nginx`.
#
# Monita needs, in its env file:
#   MONITA_BASE_URL=https://monita.company.co.id   (the exact address users open)
#   MONITA_TRUST_PROXY=true                         (reads the caller from X-Forwarded-For)
#
# No limit_req here on purpose: a limit per address would lock out everyone behind one office or
# carrier address (decision Q45). Monita limits sign-in per account itself.

server {
    listen 80;
    listen [::]:80;
    server_name monita.company.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monita.company.co.id;

    ssl_certificate     /etc/ssl/monita/fullchain.pem;
    ssl_certificate_key /etc/ssl/monita/privkey.pem;

    # Forms stop at 128 KiB inside Monita; a heartbeat's /fail ping may carry up to 16 MiB of log.
    client_max_body_size 16m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:7466;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not appended: Monita reads the right-most entry, and this keeps it the real caller.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A check list or a chart can take a few seconds on a big project.
        proxy_read_timeout 60s;
    }
}
